services:
  tailscale-homelab:
    image: tailscale/tailscale:latest
    container_name: tailscale-homelab
    restart: unless-stopped
    network_mode: host
    cap_add:
      - net_admin
      - net_raw
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY_HOMELAB}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--advertise-exit-node
      - TS_ROUTES=192.168.1.0/24
      - TS_ACCEPT_DNS=true
    volumes:
      - /opt/docker/tailscale-homelab:/var/lib/tailscale
